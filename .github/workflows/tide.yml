name: tide
on:
  workflow_dispatch:
  schedule:
    - cron: '0 22 * * *'   # UTC 22:00 → 北京时间 次日 06:00

jobs:
  run-python-script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.13'
      - run: pip install requests
      - run: python tide.py